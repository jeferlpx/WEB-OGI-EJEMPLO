<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072316" />
      <stop offset="50%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#0A3622" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.18)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Fondo Institucional -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="200" r="280" fill="url(#goldGlow)" />

  <!-- Borde Interno Decorativo -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Escudo / Silueta de Fondo -->
  <g opacity="0.08" transform="translate(320, 100) scale(1.6)">
    <path d="M 50 0 L 100 20 L 100 70 Q 100 110 50 130 Q 0 110 0 70 L 0 20 Z" fill="#ffffff" />
  </g>

  <!-- Insignia Central: Cámara y Espacio Reservado -->
  <g transform="translate(400, 190)">
    <!-- Círculo contenedor -->
    <circle cx="0" cy="0" r="54" fill="rgba(15,81,50,0.8)" stroke="#D4AF37" stroke-width="2.5" />
    
    <!-- Ícono de Cámara -->
    <path d="M -22 -10 L -14 -10 L -10 -16 L 10 -16 L 14 -10 L 22 -10 C 26 -10 28 -8 28 -4 L 28 16 C 28 20 26 22 22 22 L -22 22 C -26 22 -28 20 -28 16 L -28 -4 C -28 -8 -26 -10 -22 -10 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="6" r="9" fill="none" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="16" cy="-4" r="2" fill="#ffffff" />

    <!-- Pequeño reloj / indicador de pendiente -->
    <g transform="translate(26, 18) scale(0.75)">
      <circle cx="0" cy="0" r="14" fill="#D4AF37" />
      <path d="M 0 -8 L 0 0 L 6 4" fill="none" stroke="#072316" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Badge Superior -->
  <g transform="translate(400, 280)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(212,175,55,0.2)" stroke="#D4AF37" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FDE68A" letter-spacing="1">
      FOTO DE REFERENCIA OFICIAL
    </text>
  </g>

  <!-- Textos Informativos -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Fotografía Pendiente de Carga
  </text>

  <text x="400" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(209,250,229,0.85)">
    Espacio reservado para imagen institucional de la UNALM
  </text>

  <text x="400" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="rgba(212,175,55,0.85)" letter-spacing="0.5">
    OGI — Universidad Nacional Agraria La Molina
  </text>
</svg>

